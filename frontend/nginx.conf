server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A API (Spring Boot) expõe os endpoints na raiz (/sales, /sellers — sem
  # prefixo /api). O front end é buildado com REACT_APP_BACKEND_URL vazio,
  # então o axios chama caminhos relativos como "/sales", que caem aqui e
  # são repassados para o serviço "backend" do docker-compose.
  location /sales {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /sellers {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
